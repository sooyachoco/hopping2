<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>아바타 파스텔 호핑</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    font-family: 'BM JUA OTF', sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .frame-wrapper {
    width: 100%;
    max-width: 2560px;
  }
  .frame {
    position: relative;
    width: 2560px;
    height: 3527px;
    background: #fff;
    overflow: hidden;
    transform-origin: top center;
  }
  .frame img { display: block; max-width: none; pointer-events: none; }
  .abs { position: absolute; }
  .cover { object-fit: cover; width: 100%; height: 100%; }
  .clip { overflow: hidden; width: 100%; height: 100%; }

  /* background */
  .bg-sky { left: -62px; top: -26px; width: 2684px; height: 4798px; }

  /* ===== Hero: Figma z-order: lena → ciel → title → ru → aisha → ad → ain → period ===== */
  .lena-2p1  { left: 865px;  top: 121px; width: 300px;  height: 534px; z-index: 1; }
  .ciel-2p   { left: 1329px; top: 90px;  width: 354px;  height: 565px; z-index: 2; }
  .title-br  { left: 889px;  top: 260px; width: 686px;  height: 593px; z-index: 3; }
  .ru-1p     { left: 546px;  top: 231px; width: 298px;  height: 632px; z-index: 4; }
  .aisha-1p1 { left: 1464px; top: 250px; width: 550px;  height: 662px; z-index: 5; }
  .ad-1p1    { left: 1368px; top: 250px; width: 572px;  height: 748px; z-index: 6; }
  .ain-1p1   { left: 695px;  top: 254px; width: 340px;  height: 740px; z-index: 7; }
  .period    { left: 958px;  top: 853px; width: 644px;  height: 80px;  z-index: 8; }

  /* ===== Sora section ===== */
  .panel-sora    { left: 759px;  top: 1034px; width: 1042px;   height: 636px; }
  .title-sora    { left: 992px;  top: 998px;  width: 576px;    height: 113px; }
  .ravi-1p       { left: 922px;  top: 1122px; width: 149px;    height: 249px; }
  .raven-1p      { left: 997px;  top: 1139px; width: 250px;    height: 247px; }
  .ru-1p-2       { left: 1280px; top: 1132px; width: 124px;    height: 262px; }
  .aisha-1p-2    { left: 890px;  top: 1332px; width: 231px;    height: 278px; }
  .ain-1p-2      { left: 1112px; top: 1336px; width: 123.74px; height: 269px; }
  .ad-1p-2       { left: 1228px; top: 1342px; width: 196px;    height: 257px; }
  .elsword-1p    { left: 1326px; top: 1125px; width: 287px;    height: 261px; }
  .elysion-1p-an { left: 1415px; top: 1359px; width: 170px;    height: 235px; }

  /* ===== Black section ===== */
  .panel-black { left: 759px;  top: 1737px; width: 1042px;    height: 636px; }
  .title-black { left: 931px;  top: 1687px; width: 658px;     height: 136px; }
  .noah-2p     { left: 938px;  top: 1822px; width: 157.008px; height: 261px; }
  .lena-2p-2   { left: 1121px; top: 1830px; width: 143px;     height: 253px; }
  .rose-2p     { left: 1289px; top: 1822px; width: 134.09px;  height: 253px; }
  .lithia-2p   { left: 913px;  top: 2018px; width: 215px;     height: 285px; }
  .ciel-2p-2   { left: 1302px; top: 2015px; width: 186px;     height: 297px; }
  .ara-2p      { left: 1039px; top: 2020px; width: 272px;     height: 285px; }
  .eve-2p      { left: 1415px; top: 1822px; width: 228px;     height: 272px; }
  .chung-2p    { left: 1490px; top: 2041px; width: 203.034px; height: 256px; }

  /* ===== Bonus section ===== */
  .panel-bonus  { left: 723px;  top: 2421px; width: 1114px; height: 865px; }
  .title-bonus  { left: 922px;  top: 2441px; width: 698px;  height: 135px; }
  .elysion-hair { left: 1259px; top: 2598px; width: 219px;  height: 274px; }
  .elysion-acc  { left: 1000px; top: 2607px; width: 246px;  height: 265px; }
  .elsword-hair { left: 947px;  top: 2828px; width: 312px;  height: 334px; }
  .elsword-acc  { left: 1244px; top: 2828px; width: 412px;  height: 343px; }

  /* ===== Notice ===== */
  .notice {
    position: absolute;
    left: 0;
    right: 0;
    top: 3335px;
    color: #524b71;
    font-size: 22px;
    line-height: 34px;
    text-align: center;
  }
  .notice p { margin: 0; }

  /* ===== Clipped images ===== */
  .clip > img { position: absolute; }
  .title-br > .clip > img    { left: 0; top: -6.33%;    width: 100%; height: 115.71%; }
  .period > .clip > img      { left: -2.02%; top: -349.59%; width: 104.04%; height: 832.52%; }
  .panel-sora > .clip > img,
  .panel-black > .clip > img { left: 0; top: -30.88%;   width: 100%; height: 163.84%; }
  .title-sora > .clip > img  { left: 0; top: -198.01%;  width: 100%; height: 509.45%; }
  .title-black > .clip > img { left: 0; top: -187.26%;  width: 100%; height: 483.02%; }
  .panel-bonus > .clip > img { left: 0; top: -14.02%;   width: 100%; height: 128.77%; }
  .title-bonus > .clip > img { left: 0; top: -196.97%;  width: 100%; height: 517.17%; }

  /* ======================================================
     ANIMATIONS
     ====================================================== */

  /* --- Hero title: scale bounce in --- */
  .hero-title {
    opacity: 0;
    transform: scale(0.6) translateY(30px);
    animation: heroTitleIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
  }
  @keyframes heroTitleIn {
    0%   { opacity: 0; transform: scale(0.6) translateY(30px); }
    60%  { opacity: 1; transform: scale(1.05) translateY(-5px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* --- Hero characters: slide up from below --- */
  .hero-char {
    opacity: 0;
    transform: translateY(80px) scale(0.95);
  }
  @keyframes heroCharIn {
    0%   { opacity: 0; transform: translateY(80px) scale(0.95); }
    70%  { opacity: 1; transform: translateY(-10px) scale(1.01); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* --- Hero period text --- */
  .hero-period {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeSlideUp 0.8s ease-out 1.8s forwards;
  }
  @keyframes fadeSlideUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* --- Floating idle loop for hero chars --- */
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }
  .hero-char.float { opacity: 1 !important; }

  /* --- Title idle pulse --- */
  @keyframes titlePulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.015); }
  }
  .hero-title.pulse {
    opacity: 1 !important;
    animation: titlePulse 4s ease-in-out infinite;
  }

  /* --- Scroll: panel fade up --- */
  .scroll-reveal {
    opacity: 0;
    transform: translateY(60px);
    transition: opacity 0.8s ease-out, transform 0.8s ease-out;
  }
  .scroll-reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* --- Scroll: section title bounce --- */
  .scroll-title {
    opacity: 0;
    transform: scale(0.7) translateY(30px);
    transition: opacity 0.7s ease-out, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .scroll-title.visible {
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  /* --- Scroll: character pop in --- */
  .scroll-char {
    opacity: 0;
    transform: translateY(40px) scale(0.9);
    transition: opacity 0.6s ease-out, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .scroll-char.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .scroll-char[data-delay="1"] { transition-delay: 0.05s; }
  .scroll-char[data-delay="2"] { transition-delay: 0.1s; }
  .scroll-char[data-delay="3"] { transition-delay: 0.15s; }
  .scroll-char[data-delay="4"] { transition-delay: 0.2s; }
  .scroll-char[data-delay="5"] { transition-delay: 0.25s; }
  .scroll-char[data-delay="6"] { transition-delay: 0.3s; }
  .scroll-char[data-delay="7"] { transition-delay: 0.35s; }
  .scroll-char[data-delay="8"] { transition-delay: 0.4s; }

  /* --- Scroll: notice fade --- */
  .scroll-notice {
    opacity: 0;
    transition: opacity 1s ease-out;
  }
  .scroll-notice.visible {
    opacity: 1;
  }
</style>
</head>

<script>
// Scale frame to fit viewport width
function scaleFrame() {
  const wrapper = document.querySelector('.frame-wrapper');
  const frame = document.querySelector('.frame');
  const scale = Math.min(1, wrapper.offsetWidth / 2560);
  frame.style.transform = `scale(${scale})`;
  wrapper.style.height = (3527 * scale) + 'px';
}
scaleFrame();
window.addEventListener('resize', scaleFrame);
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });

document.querySelectorAll('.scroll-reveal, .scroll-char, .scroll-title, .scroll-notice')
  .forEach(el => observer.observe(el));

setTimeout(() => {
  document.querySelectorAll('.hero-char').forEach((el, i) => {
    el.style.opacity = '1';
    el.style.transform = 'none';
    el.classList.add('float');
    el.style.animation = `float 3s ease-in-out ${i * 0.4}s infinite`;
  });
  const title = document.querySelector('.hero-title');
  if (title) title.classList.add('pulse');
}, 2400);
</script>
